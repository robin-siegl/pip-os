name: Capture README screenshots

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/screenshots.yml'
      - 'app/src/androidTest/java/dev/pipos/launcher/ScreenshotCaptureTest.kt'

permissions:
  contents: write

concurrency:
  group: pip-os-screenshots
  cancel-in-progress: false

jobs:
  screenshots:
    name: Capture real emulator screens
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Capture app screens on Android 35
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: |
            set -e
            gradle :app:connectedDebugAndroidTest --stacktrace \
              -Pandroid.testInstrumentationRunnerArguments.class=dev.pipos.launcher.ScreenshotCaptureTest
            mkdir -p docs/screenshots
            for file in apps.png apps-edit.png stat.png settings.png; do
              adb pull "/sdcard/Android/data/dev.pipos.launcher/files/screenshots/$file" "docs/screenshots/$file"
            done
            test -s docs/screenshots/apps.png
            test -s docs/screenshots/apps-edit.png
            test -s docs/screenshots/stat.png
            test -s docs/screenshots/settings.png
      - name: Upload captured PNGs
        uses: actions/upload-artifact@v4
        with:
          name: pip-os-readme-screenshots
          path: docs/screenshots/*.png
          if-no-files-found: error
      - name: Commit screenshots
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/screenshots/*.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture actual PIP-OS screens from Android emulator"
            git fetch origin main
            git rebase origin/main
            git push origin HEAD:main
          fi
