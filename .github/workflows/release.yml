name: Production release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      bump:
        description: 'Next version (ignored when an exact version is entered)'
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
      version:
        description: 'Optional exact version, e.g. 0.2.0 for the first release'
        required: false
        type: string

permissions:
  contents: read

# Prevent two releases from choosing the same "next version".
concurrency:
  group: pip-os-production-release
  cancel-in-progress: false

jobs:
  verify:
    name: Resolve version, unit tests and lint
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Test version selection
        run: bash scripts/test-release-version.sh
      - name: Resolve release version
        id: version
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.version || '' }}
          RELEASE_BUMP: ${{ inputs.bump || 'patch' }}
        run: bash scripts/resolve-release-version.sh
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Unit tests and lint
        run: >
          gradle :app:testDebugUnitTest :app:lintRelease --stacktrace
          -PreleaseVersion=${{ steps.version.outputs.version }}
          -PreleaseVersionCode=${{ steps.version.outputs.version_code }}

  release:
    name: Sign and publish APK and AAB
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      PIPOS_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      PIPOS_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      PIPOS_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Restore signing key
        shell: bash
        run: |
          set -euo pipefail
          for value in "$ANDROID_KEYSTORE_BASE64" "$PIPOS_KEYSTORE_PASSWORD" "$PIPOS_KEY_ALIAS" "$PIPOS_KEY_PASSWORD"; do
            if [[ -z "$value" ]]; then
              echo 'Missing Android signing secrets. See docs/RELEASING.md.' >&2
              exit 1
            fi
          done
          keystore="$RUNNER_TEMP/pipos-production.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore"
          chmod 600 "$keystore"
          echo "PIPOS_KEYSTORE_PATH=$keystore" >> "$GITHUB_ENV"
      - name: Build signed release
        run: |
          gradle :app:assembleRelease :app:bundleRelease --stacktrace \
            -PreleaseVersion=${{ needs.verify.outputs.version }} \
            -PreleaseVersionCode=${{ needs.verify.outputs.version_code }}
      - name: Prepare release files
        shell: bash
        env:
          VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/PIP-OS-v${VERSION}.apk"
          cp app/build/outputs/bundle/release/app-release.aab "dist/PIP-OS-v${VERSION}.aab"
          (cd dist && sha256sum *.apk *.aab > SHA256SUMS.txt)
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: pip-os-v${{ needs.verify.outputs.version }}
          path: dist/*
          if-no-files-found: error
      - name: Publish GitHub release and create tag if needed
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.verify.outputs.tag }}
          RELEASE_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          set -euo pipefail
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            # GitHub creates the tag at the exact validated source commit.
            gh release create "$RELEASE_TAG" dist/* \
              --target "$GITHUB_SHA" \
              --title "PIP-OS $RELEASE_VERSION" \
              --generate-notes
          else
            gh release create "$RELEASE_TAG" dist/* \
              --verify-tag \
              --title "PIP-OS $RELEASE_VERSION" \
              --generate-notes
          fi
